<style>

</head><body><main class="dashboard-container">
<img id="brand" class="ford-logo" alt="" height="54"><h2 id="title"></h2><div class="row"><section>
<div class="file-drop-area" id="drop" role="button" tabindex="0" aria-label="Open EEPROM file"><p>Load EEPROM dump: <span>Browse…</span></p></div><input type="file" id="file" accept=".bin,.eeprom,.flash,.eep,.rom" hidden>
<label for="variant">Calculator / IC type</label><select id="variant" aria-label="Calculator or IC type"></select>
<div class="reading"><small>Current Mileage (KM)</small><div id="km">—</div><small id="readState">Open a file to read KM</small></div>
<label for="newKm">New Mileage (KM)</label><div class="input-group"><input type="number" id="newKm" placeholder="New mileage" min="0" step="1" disabled><span>KM</span></div>
<p id="targetInfo" class="hint" aria-live="polite"></p><div class="buttons"><button id="apply" class="primary" disabled>Apply Mileage</button><button id="save" class="success" disabled>Save Dump As…</button><button id="reset" disabled>Restore Original Dump</button></div>
<div id="messageArea" role="status" aria-live="polite">Open a raw memory file (up to 16 MiB).</div><p id="writeState" class="hint"></p><div id="fileInfo" class="file-info"></div>
</section><section><div class="toolbar"><button id="location">KM Location</button><label for="find">Find</label><input id="find" placeholder='HEX: 1F 3A   text: "ML3T"' aria-label="Find HEX bytes or text"><button id="findPrev" title="Previous match (Shift+Enter)">‹</button><button id="findNext" title="Next match (Enter)">›</button></div>
<div class="tool-row"><button id="undo" disabled title="Ctrl+Z">↶ Undo</button><button id="redo" disabled title="Ctrl+Y">↷ Redo</button><button id="prevChange" disabled>‹ Prev change</button><button id="nextChange" disabled>Next change ›</button></div>
<div id="hex" class="hex-viewer"><p style="padding:15px;color:#666">File bytes will appear here.</p></div><div class="shared-controls"><button id="prev" disabled>‹ Previous</button><span id="page">—</span><button id="next" disabled>Next ›</button></div>
<div id="inspector" hidden></div>
</section></div>

<script>
'use strict';

const hex=(n,w=2)=>n.toString(16).toUpperCase().padStart(w,'0');

const PAGE=256,MAX_UNDO=500;

/* ------------------------------------------------------------------

   PLAN/ENCODE a new value and NAME the saved file. Everything else
   (open, view, HEX editing, undo, search, save) is shared.
   The Ford and Isuzu algorithms are unchanged from the previous build.
------------------------------------------------------------------- */
const hexOnly=(key,name,logoWidth)=>({
  vehicle:name,title:name+' Instrument Cluster EEPROM Editor (HEX)',logoWidth,
  detect:()=>({}),
  inspect(){
   return{canWrite:false,km:'Unknown',state:'No mileage algorithm for '+name+' yet',
    note:name+' is available as a HEX editor: open a dump, edit bytes, search, undo/redo and save. Automatic mileage editing needs a verified algorithm for the specific model.',

  },
  plan(){throw Error('Automatic mileage editing is not available for '+name+'.')},

  done:()=>'',

const Profiles={
 ford:{
  vehicle:'Ford F150',title:'Ford F150 24X_24C64 Instrument Cluster EEPROM Editor',logoWidth:150,
  detect:data=>({module:KM.detect(data)[0]||null}),
  inspect(data,ctx){

   const newKm=s.requestedKm!==null?s.requestedKm:a?.currentKm;
   return'DC_FORD__Ford F-150 - 2021 - OLD '+kmText(oldKm)+' km - NEW '+kmText(newKm)+' km - MOD - 24X_24C64 EEPROM'+(s.requestedKm===null&&!a?.referenceMatch?' - HEX-UNVERIFIED':'')+'.bin';
  }
 },
 isuzu:{
  vehicle:'Isuzu D-MAX',title:'Isuzu D-MAX 93C66 Instrument Cluster EEPROM Editor',logoWidth:180,min:100,max:999900,
  detect:()=>({}),
  read(data){if(data.length<100)return null;const v=(data[1]<<8)|data[0];return v===0xFFFF?null:v*23},
  inspect(data){
   const km=this.read(data),canWrite=data.length>=100;
   return{canWrite,km:km!==null?format(km):'Unknown',

  plan(km){if(km<100||km>999900)throw Error('Mileage must be between 100 and 999900 KM');const raw=Math.floor(km/23);return'Encoded value: '+raw+' × 23 = '+format(raw*23)+' KM. Stored in whole units of 23 KM.'},

  },
  done:()=> 'Modification successful',

 },
 toyota:hexOnly('toyota','Toyota',200),
 kia:hexOnly('kia','Kia',170),
 hyundai:hexOnly('hyundai','Hyundai',200),
 mazda:hexOnly('mazda','Mazda',110),
 gm:hexOnly('gm','GM',90)

const PROFILE_KEY=Profiles[new URLSearchParams(location.search).get('profile')]?new URLSearchParams(location.search).get('profile'):'ford';
/* ------------------------------------------------------------------
   Calculator / IC types per vehicle.
   Every vehicle has a list of types (e.g. Isuzu 93C66, Isuzu 93C86). All types
   share the same screen; only the calculator (inspect / plan / encode / fileName)
   changes. To add a new type: write an object with those methods (see
   Profiles.isuzu) and add one line to Variants below. `pending:true` shows the
   option greyed out as "coming soon".
------------------------------------------------------------------- */
const Variants={
 ford:[{id:'24c64',label:'24C64 · ML3T (F150 2021)',impl:Profiles.ford}],
 isuzu:[{id:'93c66',label:'93C66 · D-MAX',impl:Profiles.isuzu},{id:'93c86',label:'93C86 · not available yet',pending:true}],
 toyota:[{id:'hex',label:'HEX editor (no calculator yet)',impl:Profiles.toyota}],
 kia:[{id:'hex',label:'HEX editor (no calculator yet)',impl:Profiles.kia}],
 hyundai:[{id:'hex',label:'HEX editor (no calculator yet)',impl:Profiles.hyundai}],
 mazda:[{id:'hex',label:'HEX editor (no calculator yet)',impl:Profiles.mazda}],
 gm:[{id:'hex',label:'HEX editor (no calculator yet)',impl:Profiles.gm}]
};
const vehicleMeta=Profiles[PROFILE_KEY];
const storeKey='calcType_'+PROFILE_KEY;
let variantId=(()=>{try{return localStorage.getItem(storeKey)}catch{return null}})();
let variant=Variants[PROFILE_KEY].find(v=>v.id===variantId&&!v.pending)||Variants[PROFILE_KEY].find(v=>!v.pending);
// `profile` = vehicle info (name, logo, title) + the methods of the selected calculator type
const profile=new Proxy({},{get:(_,k)=>['vehicle','title','logoWidth'].includes(k)?vehicleMeta[k]:variant.impl[k]});

/* ---------------------------------------------------------------- state */
const state={original:null,data:null,ctx:null,info:null,name:'',page:0,anchor:null,selected:null,changes:[],requestedKm:null,undo:[],redo:[],hit:null};
let dirty=false;
window.hasUnsavedChanges=()=>dirty;
const editLog=[];
const message=(text,error=false)=>{$('messageArea').textContent=text;$('messageArea').classList.toggle('error',error)};
function logEdit(kind,entries,details){editLog.push({time:new Date().toISOString(),operation:kind,details:details||{},changedBytes:entries.length,changes:entries.map(e=>({offset:'0x'+hex(e.i,6),old:hex(e.o),new:hex(e.n)}))})}
function diffEntries(a,b){const out=[];for(let i=0;i<a.length;i++)if(a[i]!==b[i])out.push({i,o:a[i],n:b[i]});return out}
function writeEntries(entries,dir){for(const e of entries)state.data[e.i]=dir>0?e.n:e.o}
function commit(kind,entries,details,km){
 if(entries.length){dirty=true;state.undo.push({kind,entries,prevKm:state.requestedKm,km});if(state.undo.length>MAX_UNDO)state.undo.shift();state.redo.length=0;logEdit(kind,entries,details)}

}
function setBytes(start,values,kind){
 const entries=[];values.forEach((v,k)=>{const i=start+k;if(i>=0&&i<state.data.length&&state.data[i]!==v)entries.push({i,o:state.data[i],n:v})});

}
function undo(){const s=state.undo.pop();if(!s)return;dirty=true;writeEntries(s.entries,-1);state.redo.push(s);logEdit('UNDO',s.entries.map(e=>({i:e.i,o:e.n,n:e.o})),{of:s.kind});state.requestedKm=s.prevKm;refresh();message('Undone: '+labelOf(s.kind)+' ('+s.entries.length+' byte'+(s.entries.length===1?'':'s')+').')}

const labelOf=k=>({HEX_EDIT:'byte edit',PASTE:'paste',MILEAGE:'mileage change',RESTORE:'restore original'}[k]||k);

/* ------------------------------------------------------------- refresh */
function refresh(){
 const d=state.data;if(!d)return;
 state.changes=[];for(let i=0;i<d.length;i++)if(d[i]!==state.original[i])state.changes.push(i);
 const s=state.info=profile.inspect(d,state.ctx);
 $('save').disabled=false;$('reset').disabled=!state.changes.length;
 $('undo').disabled=!state.undo.length;$('redo').disabled=!state.redo.length;
 $('newKm').disabled=!s.canWrite;$('apply').disabled=!s.canWrite;
 $('km').textContent=s.km;$('readState').textContent=s.state;$('writeState').textContent=s.note;
 $('fileInfo').textContent=state.name+' · '+format(d.length)+' bytes · '+s.info;
 $('location').disabled=!s.ranges.length;
 ['prevChange','nextChange'].forEach(id=>$(id).disabled=!state.changes.length);

}
const isKm=i=>state.info.ranges.some(r=>r.kind==='km'&&i>=r.start&&i<=r.end);
const inHit=i=>state.hit&&i>=state.hit.start&&i<state.hit.start+state.hit.len;
const selRange=()=>state.selected===null?null:[Math.min(state.anchor,state.selected),Math.max(state.anchor,state.selected)];

/* ------------------------------------------------------------ HEX grid */
const hexEl=$('hex');
function render(){
 const d=state.data;if(!d)return;

 const head=document.createElement('div');head.className='shared-row shared-head';
 for(const t of['Offset',...Array.from({length:16},(_,i)=>hex(i)),'ASCII']){const s=document.createElement('span');s.textContent=t;head.append(s)}
 frag.append(head);
 for(let o=start;o<end;o+=16){
  const row=document.createElement('div');row.className='shared-row';
  const off=document.createElement('span');off.className='offset';off.textContent=hex(o,6);row.append(off);
  const ascii=document.createElement('span');ascii.className='shared-ascii';
  for(let j=0;j<16;j++){
   const i=o+j,b=document.createElement('button');b.className='shared-byte';b.type='button';
   if(i<end){
    const v=d[i];b.textContent=hex(v);b.dataset.offset=i;
    b.title='Offset 0x'+hex(i,6)+' ('+i+') · '+v+' · type two HEX digits';

    if(sel&&i>=sel[0]&&i<=sel[1])b.classList.add('selected');

   }else b.disabled=true;
   row.append(b);
  }

 $('page').textContent='0x'+hex(start,6)+' – 0x'+hex(end-1,6)+' / '+d.length+' bytes · page '+(state.page+1)+'/'+Math.ceil(d.length/PAGE);

}
function moveTo(target,extend,focus=true){
 const n=state.data.length;if(target<0)target=0;if(target>=n)target=n-1;
 state.selected=target;if(!extend||state.anchor===null)state.anchor=target;

}
let pending='';
hexEl.addEventListener('click',e=>{const t=e.target.closest('[data-offset]');if(!t)return;moveTo(Number(t.dataset.offset),e.shiftKey)});
hexEl.addEventListener('keydown',e=>{
 const b=e.target.closest('.shared-byte');if(!b||b.disabled)return;const i=Number(b.dataset.offset),n=state.data.length;

  if(e.key.toLowerCase()==='c'){e.preventDefault();copySelection()}

hexEl.addEventListener('focusout',e=>{const b=e.target.closest?.('.shared-byte');if(b&&pending){pending='';if(state.data&&b.dataset.offset!==undefined){b.textContent=hex(state.data[Number(b.dataset.offset)]);b.classList.remove('editing')}}});

 if(state.selected===null)return;e.preventDefault();
 const text=(e.clipboardData.getData('text')||'').replace(/0x/gi,'').replace(/[\s,;:-]+/g,'');

async function copySelection(){

}
$('prev').onclick=()=>{if(state.page){state.page--;render()}};
$('next').onclick=()=>{if(state.data&&(state.page+1)*PAGE<state.data.length){state.page++;render()}};

/* ------------------------------------------------ inspector / byte form */
function selectByte(){
 const yes=state.selected!==null&&state.data,r=yes?selRange():null,i=yes?r[0]:null;
 const el=$('inspector');
 if(!yes){el.replaceChildren();el.hidden=true;return}
 el.hidden=false;const d=state.data,b=d[i];
 const rows=[['Offset','0x'+hex(i,6)+' · '+i],['Byte','0x'+hex(b)+' · '+b+' · '+b.toString(2).padStart(8,'0')],['Char',b>=32&&b<=126?"'"+String.fromCharCode(b)+"'":'—']];
 if(i+1<d.length){rows.push(['u16 LE',format(d[i]|d[i+1]<<8)],['u16 BE',format(d[i]<<8|d[i+1])])}

 el.replaceChildren(...rows.map(([k,v])=>{const s=document.createElement('span');s.append(k+' ');const bb=document.createElement('b');bb.textContent=v;s.append(bb);return s}));
}

/* ------------------------------------------------------ navigation/search */
$('location').onclick=()=>{const r=state.info?.ranges.find(r=>r.kind==='km');if(r){state.hit={start:r.start,len:r.end-r.start+1};moveTo(r.start,false,true)}else message('No known KM location.',true)};

function find(dir){
 if(!state.data)return;const p=parseQuery($('find').value);
 if(!p)return message('Search HEX like "1F 3A" or text like "ML3T" (with quotes).',true);
 const d=state.data,n=d.length,from=state.selected===null?(dir>0?-1:n):(dir>0?selRange()[0]:selRange()[1]);
 for(let step=1;step<=n;step++){
  const s=((from+dir*step)%n+n)%n;if(s+p.length>n)continue;
  let ok=true;for(let k=0;k<p.length;k++)if(d[s+k]!==p[k]){ok=false;break}
  if(ok){state.hit={start:s,len:p.length};state.anchor=s;state.selected=s+p.length-1;state.page=Math.floor(s/PAGE);render();selectByte();message('Found at 0x'+hex(s,6)+'.');return}
 }

}
$('findNext').onclick=()=>find(1);$('findPrev').onclick=()=>find(-1);
$('find').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();find(e.shiftKey?-1:1)}};
function jumpChange(dir){
 if(!state.changes.length)return;const cur=state.selected===null?(dir>0?-1:state.data.length):selRange()[dir>0?1:0];
 const c=state.changes,t=dir>0?c.find(i=>i>cur)??c[0]:[...c].reverse().find(i=>i<cur)??c[c.length-1];

}
$('nextChange').onclick=()=>jumpChange(1);$('prevChange').onclick=()=>jumpChange(-1);
$('undo').onclick=undo;$('redo').onclick=redo;
document.addEventListener('keydown',e=>{
 if(!(e.ctrlKey||e.metaKey)||e.altKey||/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement?.tagName))return;
 const k=e.key.toLowerCase();
 if(k==='z'&&!e.shiftKey){e.preventDefault();undo()}else if(k==='y'||(k==='z'&&e.shiftKey)){e.preventDefault();redo()}else if(k==='f'){e.preventDefault();$('find').focus()}

/* ----------------------------------------------------------- open / save */
let ticket=0;
async function openFile(file){

 if(!file.size||file.size>16777216)return message('Choose a non-empty file up to 16 MiB.',true);
 try{
  const data=new Uint8Array(await file.arrayBuffer());if(t!==ticket)return;
  state.original=data.slice();state.data=data.slice();state.name=file.name;state.ctx=profile.detect(data);
  state.page=0;state.selected=null;state.anchor=null;state.hit=null;state.requestedKm=null;state.undo=[];state.redo=[];pending='';dirty=false;
  editLog.length=0;editLog.push({time:new Date().toISOString(),operation:'OPEN',details:{file:file.name,size:data.length},changedBytes:0,changes:[]});
  $('newKm').value='';refresh();
  if(state.info.currentKm!==null&&state.info.currentKm!==undefined)$('newKm').value=state.info.currentKm;
  previewTarget();
  message(state.info.currentKm!==null&&state.info.currentKm!==undefined?'File opened. Enter a target KM value or select a HEX byte.':'File opened, but no valid mileage was found. Manual HEX editing is available.',false);
 }catch(e){message('Could not open file: '+e.message,true)}
}
$('drop').onclick=()=>$('file').click();
$('drop').onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();$('file').click()}};
$('file').onchange=e=>{openFile(e.target.files[0]);e.target.value=''};
for(const ev of['dragover','dragenter'])$('drop').addEventListener(ev,e=>{e.preventDefault();$('drop').classList.add('dragover')});
for(const ev of['dragleave','drop'])$('drop').addEventListener(ev,e=>{e.preventDefault();$('drop').classList.remove('dragover')});
$('drop').addEventListener('drop',e=>openFile(e.dataTransfer.files[0]));

function previewTarget(){
 const text=$('newKm').value.trim();
 if(!state.data||!/^\d+$/.test(text)||!profile.plan||!state.info?.canWrite){$('targetInfo').textContent='';return}
 try{$('targetInfo').textContent=profile.plan(Number(text),state.ctx)}catch(e){$('targetInfo').textContent=e.message}
}
$('newKm').oninput=previewTarget;
$('apply').onclick=()=>{
 try{
  const s=$('newKm').value.trim();
  if(!/^\d+$/.test(s))throw Error('Enter a non-negative whole number.');
  const n=Number(s);if(!Number.isSafeInteger(n))throw Error('Mileage is outside the supported range.');
  const before=state.data,result=profile.encode(before,n,state.ctx);
  if(result.length!==state.original.length)throw Error('Modified file failed validation.');
  const entries=diffEntries(before,result);state.data=result;
  commit('MILEAGE',entries,{targetKm:n},n);previewTarget();message(profile.done(n));
 }catch(e){message(e.message,true)}
};
$('reset').onclick=()=>{const entries=diffEntries(state.data,state.original);state.data=state.original.slice();commit('RESTORE',entries,{});previewTarget();message('Original bytes restored. (Undo brings your edits back.)')};
$('save').onclick=()=>{
 if(!state.data)return;
 if(state.data.length!==state.original.length)return message('File size mismatch. Save cancelled.',true);
 const name=profile.fileName({name:state.name,original:state.original,data:state.data,ctx:state.ctx,info:state.info,requestedKm:state.requestedKm});
 const url=URL.createObjectURL(new Blob([state.data],{type:'application/octet-stream'})),link=document.createElement('a');
 link.href=url;link.download=name;document.body.append(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),30000);
 dirty=false;message('Saving… choose where to keep the file.');
};

/* ------------------------------------------------------------- audit hook */
const originalAnchorClick=HTMLAnchorElement.prototype.click;
HTMLAnchorElement.prototype.click=function(){
 if(this.download&&this.download.endsWith('.bin')&&parent!==window){
  const entries=editLog.filter(e=>e.operation==='OPEN'||e.changedBytes>0);
  parent.postMessage({action:'auditSave',name:this.download,entries:entries},location.origin);
 }
 return originalAnchorClick.call(this);
};

/* ----------------------------------------------------------------- init */
(()=>{const sel=$('variant');for(const v of Variants[PROFILE_KEY]){const o=document.createElement('option');o.value=v.id;o.textContent=v.label;o.disabled=!!v.pending;if(v===variant)o.selected=true;sel.append(o)}
 sel.onchange=()=>{const v=Variants[PROFILE_KEY].find(x=>x.id===sel.value);if(!v||v.pending)return;variant=v;try{localStorage.setItem(storeKey,v.id)}catch{}
  if(state.data){state.ctx=profile.detect(state.data);state.requestedKm=null;refresh();$('newKm').value=state.info.currentKm??'';previewTarget();message('Calculator type: '+v.label+'.')}}})();
document.title=profile.title;$('title').textContent=profile.title;
$('brand').src=LOGOS[PROFILE_KEY];$('brand').alt=profile.vehicle;$('brand').style.width=profile.logoWidth+'px';
$('page').textContent='—';

</script></body></html>
