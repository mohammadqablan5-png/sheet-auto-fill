 const vehicleName=savedVehicle==='ford'?'Ford F150':savedVehicle==='isuzu'?'Isuzu D-MAX':null;document.querySelector('.saved-title h2').textContent=vehicleName?vehicleName+' - Saved Dumps':'Saved Dumps';const filtered=savedItems.filter(f=>(!vehicleName||f.vehicle===vehicleName)&&(f.name+' '+f.vehicle).toLowerCase().includes(query));
 document.getElementById('savedStatus').textContent=filtered.length+' saved dumps';
 if(!filtered.length){const empty=document.createElement('p');empty.textContent=savedItems.length?'No matching files.':'Saved BIN files will appear here after saving in a vehicle folder.';area.append(empty);return;}
 for(const vehicle of ['Ford F150','Isuzu D-MAX']){
  const files=filtered.filter(f=>f.vehicle===vehicle);if(!files.length)continue;
  const section=document.createElement('section');section.className='saved-group';
  const heading=document.createElement('div');heading.className='saved-group-title';
  const logo=document.createElement('img');const source=document.querySelectorAll('aside .vehicle img')[vehicle==='Ford F150'?0:1];if(source)logo.src=source.src;logo.alt=vehicle;
  const title=document.createElement('strong');title.textContent=vehicle;const count=document.createElement('span');count.textContent=files.length+' files';heading.append(logo,title,count);section.append(heading);
  const grid=document.createElement('div');grid.className='saved-grid';
  for(const file of files){const card=document.createElement('button');card.className='dump-card';card.title='Open '+file.name;card.onclick=()=>window.chrome.webview.postMessage({action:'openSaved',id:file.id});
   const badge=document.createElement('span');badge.className='dump-badge';badge.textContent='BIN';
   const name=document.createElement('strong');name.textContent=file.name;
   const info=document.createElement('span');info.className='dump-info';info.textContent=(file.size/1024).toLocaleString('en-US',{maximumFractionDigits:2})+' KB';
   const date=document.createElement('span');date.className='dump-date';date.textContent=file.modified;
   const open=document.createElement('span');open.className='dump-open';open.textContent='Open in editor  →';
   card.append(badge,name,info,date,open);grid.append(card);
  }section.append(grid);area.append(section);
 }
}

function showSaved(keepVehicle=false){if(!keepVehicle)savedVehicle=null;for(const e of editors.values()){e.frame.hidden=true;e.tab.classList.remove('active')}active=null;document.getElementById('welcome').style.display='flex';loadSaved()}
function loadSaved(){if(window.chrome?.webview){document.getElementById('savedStatus').textContent='Loading saved files...';window.chrome.webview.postMessage({action:'listSaved'});}else document.getElementById('savedStatus').textContent='Saved-file browsing is available in the Windows application.';}
if(window.chrome?.webview)window.chrome.webview.addEventListener('message',event=>{const m=event.data;if(m.type==='savedList'){savedItems=m.files;renderSavedCards();}else if(m.type==='savedFile'){const bytes=Uint8Array.from(atob(m.data),c=>c.charCodeAt(0));addEditor(m.profile,new File([bytes],m.name,{type:'application/octet-stream'}));}else if(m.type==='savedError')document.getElementById('savedStatus').textContent=m.message;});
loadSaved();

window.addEventListener('message',e=>{if(e.origin!==location.origin||!Array.from(editors.values()).some(v=>v.frame.contentWindow===e.source)||e.data?.action!=='auditSave')return;window.chrome?.webview?.postMessage(e.data)});

<dialog id="historyDialog"><div class="history-head"><h2>Operation History</h2><button onclick="document.getElementById('historyDialog').close()">Close</button></div><div class="history-body"><div class="history-stats"><div class="history-stat">Total operations<b id="historyTotal">0</b></div><div class="history-stat">Ford F150<b id="historyFord">0</b></div><div class="history-stat">Isuzu D-MAX<b id="historyIsuzu">0</b></div></div><div class="history-filters"><input id="historySearch" type="search" placeholder="Search file, date or mileage" oninput="renderHistory()"><select id="historyVehicle" onchange="renderHistory()"><option value="">All vehicles</option><option>Ford F150</option><option>Isuzu D-MAX</option></select><button onclick="requestHistory()">Refresh</button><label>From <input id="historyFrom" type="date" onchange="renderHistory()"></label><label>To <input id="historyTo" type="date" onchange="renderHistory()"></label><button id="exportHistoryPdf" onclick="exportHistoryPdf()">Export PDF</button></div><div class="history-scroll"><table class="history-table"><thead><tr><th>No.</th><th>Vehicle</th><th>Year</th><th>Date</th><th>Time</th><th>Old KM</th><th>New KM</th><th>Price <i class="sar" role="img" aria-label="SAR"></i></th><th>Status</th><th>File</th></tr></thead><tbody id="historyRows"></tbody></table></div><div id="historyCount">Loading...</div></div></dialog>
<script>
let historyRows=[];
function requestHistory(){if(window.chrome?.webview)window.chrome.webview.postMessage({action:'listHistory'});else document.getElementById('historyCount').textContent='Available in the Windows app.';}
function exportHistoryPdf(){const from=document.getElementById('historyFrom').value,to=document.getElementById('historyTo').value;if(from&&to&&from>to){document.getElementById('historyCount').textContent='Invalid date range.';return;}if(!window.chrome?.webview)return;document.getElementById('exportHistoryPdf').disabled=true;window.chrome.webview.postMessage({action:'exportHistoryPdf',from:from,to:to,vehicle:document.getElementById('historyVehicle').value,search:document.getElementById('historySearch').value});}
window.chrome?.webview?.addEventListener('message',e=>{if(e.data.type==='pdfResult'){document.getElementById('exportHistoryPdf').disabled=false;document.getElementById('historyCount').textContent=e.data.message;}});
function openHistoryTable(){document.getElementById('historyDialog').showModal();requestHistory()}
function renderHistory(){const q=document.getElementById('historySearch').value.toLowerCase(),vehicle=document.getElementById('historyVehicle').value;const from=document.getElementById('historyFrom').value,to=document.getElementById('historyTo').value;if(from&&to&&from>to){document.getElementById('historyCount').textContent='From date must be before or equal to To date.';document.getElementById('historyRows').replaceChildren();return;}const rows=historyRows.filter(r=>(!vehicle||r[1]===vehicle)&&(!from||r[3]>=from)&&(!to||r[3]<=to)&&r.join(' ').toLowerCase().includes(q)).sort((a,b)=>Number(b[0])-Number(a[0]));document.getElementById('historyTotal').textContent=rows.length;document.getElementById('historyFord').textContent=rows.filter(r=>r[1]==='Ford F150').length;document.getElementById('historyIsuzu').textContent=rows.filter(r=>r[1]==='Isuzu D-MAX').length;const body=document.getElementById('historyRows');body.replaceChildren();for(const r of rows){const tr=document.createElement('tr');for(const i of [0,1,2,3,4,6,7,13,8,9]){const td=document.createElement('td');const value=r[i]||'';td.textContent=(i===6||i===7)&&/^\d+$/.test(value)?Number(value).toLocaleString('en-US'):i===13&&value!==''&&!isNaN(value)?Number(value).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}):value;if(i===9){td.className='history-file';td.title=r[10]||value}tr.append(td)}body.append(tr)}const totalPrice=rows.reduce((t,r)=>t+(Number(r[13])||0),0);document.getElementById('historyCount').innerHTML=rows.length+' of '+historyRows.length+' operations | Total price: '+totalPrice.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2})+' <i class="sar"></i> | Each successful save counts as one operation';}
window.chrome?.webview?.addEventListener('message',e=>{if(e.data.type==='operationHistory'){historyRows=e.data.rows;renderHistory()}else if(e.data.type==='savedError'&&document.getElementById('historyDialog').open)document.getElementById('historyCount').textContent=e.data.message;});
</script></html>
