        <div class="row">
            <div class="col-md-6">
                <div class="file-drop-area" id="fileDropArea">
                    <p>Load EEPROM dump: <span class="text-primary">Browse…</span></p>
                    <input type="file" id="fileInput" accept=".bin" hidden>
                </div>

                <div class="input-group mb-3">
                    <input type="number" class="form-control" id="mileageInput" placeholder="Enter new mileage">
                    <span class="input-group-text">KM</span>
                </div>

                <div class="input-group mb-3">
                    <input type="number" class="form-control" id="priceInput" placeholder="Price" min="0" step="0.01">
                    <span class="input-group-text"><i class="sar" role="img" aria-label="SAR"></i></span>
                </div>

                <div class="d-grid gap-2 mb-3">
                    <button class="btn btn-primary" onclick="handleApply()">Apply Mileage</button>
                    <button class="btn btn-success" onclick="saveFile()" id="saveBtn" disabled>Save Dump As…</button>
                </div>

                <div id="messageArea" class="status-message"></div>
            </div>

            <div class="col-md-6">
                <div class="hex-viewer" id="hexViewer">
                    <!-- Hex content will be populated here -->
                </div>
            </div>
        </div>

        <div class="info-panel mt-3">
            <h5>EEPROM Procedure</h5>
            <ul>
                <li>1. Load 93C66 dump file</li>
                <li>2. Current mileage will auto-populate</li>
                <li>3. Enter new mileage (100-999900)</li>
                <li>4. Apply changes and save modified file</li>
            </ul>
        </div>
    </div>

    <script>
        let currentFileData = null;

        const fileDropArea = document.getElementById('fileDropArea');
        const fileInput = document.getElementById('fileInput');

        // Handle file selection via click
        fileDropArea.addEventListener('click', () => fileInput.click());

        // Handle file selection via drag and drop
        fileDropArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            fileDropArea.classList.add('dragover');
        });

        fileDropArea.addEventListener('dragleave', () => {
            fileDropArea.classList.remove('dragover');
        });

        fileDropArea.addEventListener('drop', (e) => {
            e.preventDefault();
            fileDropArea.classList.remove('dragover');
            if (e.dataTransfer.files.length) {
                fileInput.files = e.dataTransfer.files;
                handleFile(fileInput.files[0]);
            }
        });

        // Handle file selection via file input
        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length) {
                handleFile(e.target.files[0]);
            }
        });

        function handleFile(file) {
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                currentFileData = new Uint8Array(e.target.result);
                updateHexViewer();
                const currentKm = readCurrentMileage(currentFileData);
                if (currentKm !== null) {
                    document.getElementById('mileageInput').value = currentKm;
                    showMessage(`Current mileage: ${currentKm} KM`, 'success');
                    document.getElementById('saveBtn').disabled = false;
                } else {
                    showMessage('Invalid file format', 'error');
                    document.getElementById('saveBtn').disabled = true;
                }
            };
            reader.readAsArrayBuffer(file);
        }

        function updateHexViewer() {
            const hexViewer = document.getElementById('hexViewer');
            hexViewer.innerHTML = '';
            
            if (!currentFileData) return;

            const bytesPerLine = 16;
            for (let i = 0; i < currentFileData.length; i += bytesPerLine) {
                const row = document.createElement('div');
                row.className = 'hex-row';
                
                // Address
                const address = document.createElement('div');
                address.className = 'hex-address';
                address.textContent = i.toString(16).padStart(4, '0').toUpperCase();
                row.appendChild(address);

                // Hex data
                const dataDiv = document.createElement('div');
                dataDiv.className = 'hex-data';
                for (let j = 0; j < bytesPerLine; j++) {
                    if (i + j >= currentFileData.length) break;
                    const byte = document.createElement('div');
                    byte.className = 'hex-byte';
                    byte.textContent = currentFileData[i + j].toString(16).padStart(2, '0').toUpperCase();
                    dataDiv.appendChild(byte);
                }
                row.appendChild(dataDiv);
                hexViewer.appendChild(row);
            }
        }

        function readCurrentMileage(data) {
            if (data.length < 100) return null;
            const var0 = (data[1] << 8) | data[0];
            if (var0 === 0xFFFF) return null;
            return var0 * 23;
        }

        function handleApply() {
            const newMileage = parseInt(document.getElementById('mileageInput').value);
            
            if (isNaN(newMileage)) {
                showMessage('Please enter valid mileage', 'error');
                return;
            }

            if (newMileage < 100 || newMileage > 999900) {
