name: Build apps

# Builds the desktop app on real Windows and macOS machines.
# Run it from the Actions tab, or push a tag like v1.0.0 to publish a Release.
on:
  workflow_dispatch:          # run it by hand from the Actions tab
  push:
    branches: ["main"]        # every push builds, so nothing has to be clicked
    tags: ["v*"]              # a version tag also publishes a Release

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40      # a hung smoke test must fail, not run forever
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows
            artifact: SHEET-auto-FILL-Windows
          - os: macos-14          # Apple Silicon (M1/M2/M3/M4)
            label: macOS Apple Silicon
            artifact: SHEET-auto-FILL-macOS-AppleSilicon
          # Intel Macs (pre-2020) are deliberately not built: GitHub's free
          # Intel runners queued for hours and never started, which left every
          # run stuck "in progress" and blocked releases. Add this back if an
          # Intel machine ever needs it:
          #   - os: macos-13
          #     label: macOS Intel
          #     artifact: SHEET-auto-FILL-macOS-Intel

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"    # broadest wheel coverage for onnxruntime/opencv

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Check for platform-specific mistakes
        run: python tools/check_portability.py

      - name: Check it runs from source
        run: python desktop.py --selftest

      - name: Build
        run: python -m PyInstaller build_app.spec --noconfirm

      - name: Smoke test the built app (macOS)
        if: runner.os == 'macOS'
        run: |
          set -e
          APP="dist/SHEET auto FILL.app"
          SUPPORT="$HOME/Library/Application Support/SHEET auto FILL"

          echo "::group::self-test"
          "$APP/Contents/MacOS/SHEET auto FILL" --selftest
          cat "$SUPPORT/selftest.log"
          echo "::endgroup::"

          echo "::group::user files land outside the bundle"
          # The app must write its runtime files to Application Support…
          test -f "$SUPPORT/selftest.log" \
            || { echo "FAIL: nothing written to Application Support"; exit 1; }
          # …and never inside the .app, which is replaced on every update.
          # config.yaml and mapping.yaml ARE shipped inside as read-only
          # defaults — only files created at runtime are a problem here.
          for f in connection.json service_account.json .asset_version selftest.log; do
            if find "$APP" -name "$f" | grep -q .; then
              echo "FAIL: $f was written inside the bundle"; exit 1
            fi
          done
          echo "user files are correctly outside the bundle"
          echo "::endgroup::"

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          cd dist
          # Ad-hoc sign so the app opens after the right-click → Open step.
          codesign --force --deep --sign - "SHEET auto FILL.app"
          codesign --verify --deep --strict "SHEET auto FILL.app" && echo "signature OK"
          # ditto is Apple's tool for archiving a bundle: it keeps symlinks,
          # permissions and the signature intact, which plain zip can lose.
          ditto -c -k --sequesterRsrc --keepParent \
                "SHEET auto FILL.app" "../${{ matrix.artifact }}.zip"
          cd ..
          ls -lh "${{ matrix.artifact }}.zip"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path "dist\SHEET auto FILL.exe" -DestinationPath "${{ matrix.artifact }}.zip"
          Get-Item "${{ matrix.artifact }}.zip" | Select-Object Name,Length

      - name: Smoke test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist\SHEET auto FILL.exe" `
                             -ArgumentList "--selftest" -Wait -PassThru
          if (Test-Path "dist\selftest.log") { Get-Content "dist\selftest.log" }
          if ($p.ExitCode -ne 0) { throw "selftest failed (exit $($p.ExitCode))" }

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.zip
          retention-days: 30

  mac-installer:
    name: macOS self-installing file
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Pure text generation — no macOS needed, so this one is quick and free.
      - name: Build the installer
        run: python tools/make_mac_installer.py

      - name: Verify it
        run: |
          f="dist/Install SHEET auto FILL.command"
          bash -n "$f"                                   # valid shell
          ! grep -q $'\r' "$f"                           # no CRLF
          start=$(awk '/^__PAYLOAD_BELOW__$/ {print NR + 1; exit}' "$f")
          mkdir -p /tmp/check
          tail -n +"$start" "$f" \
            | python -c 'import sys,base64; sys.stdout.buffer.write(base64.b64decode(sys.stdin.buffer.read()))' \
            | tar xzf - -C /tmp/check
          test -f /tmp/check/desktop.py
          # nothing private may travel inside it
          ! test -e /tmp/check/service_account.json
          ! test -e /tmp/check/connection.json
          echo "installer verified"

      - uses: actions/upload-artifact@v4
        with:
          name: SHEET-auto-FILL-macOS-Installer
          path: dist/Install SHEET auto FILL.command.zip
          retention-days: 30

  release:
    name: Publish release
    needs: [build, mac-installer]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with: { path: artifacts }
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*.zip
          generate_release_notes: true
