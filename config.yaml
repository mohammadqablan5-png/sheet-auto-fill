# Which Google Sheet to fill.
# Leave blank — the app fills this in when you paste your sheet's link into
# "Connect your Google Sheet" (step 1).
sheet_id: ""

# --- Easy connection (recommended): a script deployed inside your own sheet.
# The link and its private key are stored separately in connection.json, which is
# kept out of version control. The app writes that file when you connect.

# --- Advanced connection: a Google Cloud service-account key file.
# Only used when no script connection is set up.
service_account_file: "service_account.json"

# Local web app port
port: 8765

# Page render resolution for scanned/screenshot PDFs.
# 300 is the tested sweet spot; higher is slower and not more accurate.
ocr_dpi: 300
